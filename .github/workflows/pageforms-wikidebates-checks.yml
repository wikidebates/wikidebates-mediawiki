name: Contrôles PageFormsWikidebates

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: extensions/PageFormsWikidebates

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Tests JavaScript
        run: npm run test:node

      - name: Syntaxe PHP
        run: |
          php -l includes/PF_ValuesUtils.php
          php -l tests/phpunit/integration/includes/PFValuesUtilsTest.php

      - name: Style du code et traductions
        run: |
          npm ci
          npx grunt test
